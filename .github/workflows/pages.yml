# 部署到 GitHub Pages。
# 只发布站点文件（index / 附录 / chapters / assets）；
# reference/ 为构建期资源（审定样章、引用台账、检查脚本），按项目约定不发布。
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 构建自检（四要素 / 锚点 / 日期戳 / 死链）
        run: python3 reference/check.py

      - name: 组装发布目录（排除 reference/）
        run: |
          mkdir _site
          cp index.html glossary.html appendix-a-tooling.html appendix-c-interview-index.html _site/
          cp -r chapters assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
